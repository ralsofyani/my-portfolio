[project]
name = "rawan-portfolio"
version = "1.0.0"
description = "A bilingual (Arabic/English) single-page personal portfolio built with FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
notebooks = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "content/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
