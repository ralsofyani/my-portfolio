{# Small reusable pieces. Icons are simple, generic line drawings. #}

{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'mail' -%}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>
{%- elif name == 'linkedin' -%}<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>
{%- elif name == 'github' -%}<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>
{%- elif name == 'youtube' -%}<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/>
{%- elif name == 'cv' -%}<path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
{%- elif name == 'copy' -%}<rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
{%- elif name == 'play' -%}<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>
{%- elif name == 'link' -%}<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>
{%- elif name == 'py' -%}<path d="M12 3c-4 0-4 1.5-4 3v2h4.5M12 21c4 0 4-1.5 4-3v-2h-4.5"/><path d="M8 8H6c-2 0-3 1.5-3 4s1 4 3 4h2v-2.5a2 2 0 0 1 2-2h4a2 2 0 0 0 2-2V6"/><path d="M16 16h2c2 0 3-1.5 3-4s-1-4-3-4h-2"/><circle cx="10.5" cy="5.5" r=".6" fill="currentColor"/><circle cx="13.5" cy="18.5" r=".6" fill="currentColor"/>
{%- elif name == 'api' -%}<path d="M13 3 5 13h6l-1 8 8-10h-6z"/>
{%- elif name == 'nb' -%}<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/>
{%- elif name == 'doc' -%}<path d="M4 19.5V6a3 3 0 0 1 3-3h12v15H7a3 3 0 0 0-3 3 3 3 0 0 0 3 3h12"/><path d="M9 8h6"/>
{%- elif name == 'db' -%}<ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>
{%- elif name == 'arch' -%}<rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
{%- elif name == 'badge' -%}<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>
{%- elif name == 'lock' -%}<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'bug' -%}<rect x="7" y="7" width="10" height="13" rx="5"/><path d="M12 11v9M9 4l1.5 3M15 4l-1.5 3M3 13h4M17 13h4M4 8l3 2M20 8l-3 2M4 19l3-2M20 19l-3-2"/>
{%- elif name == 'git' -%}<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 3-3 4-6.5 4.5L8 16.5"/>
{%- elif name == 'box' -%}<path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="m4 7 8 4 8-4M12 11v10"/>
{%- elif name == 'search' -%}<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>
{%- elif name == 'pulse' -%}<path d="M3 12h4l2-5 4 10 2-5h6"/>
{%- elif name == 'menu' -%}<path d="M4 7h16M4 12h16M4 17h10"/>
{%- elif name == 'up' -%}<path d="M12 19V5M6 11l6-6 6 6"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro section_head(key, c) -%}
<header class="section-head reveal">
  <span class="kicker" data-i18n="{{ key }}.kicker">{{ c[key].kicker }}</span>
  <h2 class="section-title" data-i18n="{{ key }}.title">{{ c[key].title }}</h2>
  {% if c[key].intro %}<p class="lead" data-i18n="{{ key }}.intro">{{ c[key].intro }}</p>{% endif %}
</header>
{%- endmacro %}
